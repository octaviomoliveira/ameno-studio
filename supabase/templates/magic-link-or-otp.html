<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seu acesso ao Ameno Studio</title>
  </head>
  <body style="margin:0;background:#f3f0e9;color:#111111;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:48px 24px;">
      <p style="margin:0 0 32px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;">Ameno Studio</p>
      <h1 style="margin:0 0 16px;font-size:28px;font-weight:500;line-height:1.15;">Seu acesso à área do cliente</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Use o código abaixo na tela de login. Ele é temporário e só pode ser usado uma vez.</p>
      <p style="margin:0 0 28px;padding:18px 20px;border:1px solid #111111;font-family:monospace;font-size:30px;font-weight:700;letter-spacing:.22em;text-align:center;">{{ .Token }}</p>
      <p style="margin:0 0 16px;font-size:14px;line-height:1.6;">Se preferir, entre diretamente pelo botão:</p>
      <p style="margin:0 0 32px;">
        <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#111111;color:#ffffff;padding:14px 20px;text-decoration:none;font-size:14px;">Entrar no Ameno Studio</a>
      </p>
      <p style="margin:0;color:#666666;font-size:12px;line-height:1.6;">Se você não solicitou este acesso, ignore este e-mail. Não encaminhe o código ou o link.</p>
    </div>
  </body>
</html>
